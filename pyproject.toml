[project]
name = "grabby"
version = "0.1.0"
description = "Food recommendations based on grocery discounts, your profile, and what other users like"
readme = "README.md"
authors = [
    { name = "Florian Weigelt", email = "florian@weige.lt" },
    { name = "", email = "" },
    { name = "", email = "" },
    { name = "", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
grabby = "grabby:main"
grabby-api = "grabby.api:serve"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
